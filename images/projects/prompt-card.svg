<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Poppins,Arial,sans-serif"><rect width="1000" height="400" fill="#f4f6f9"/><rect x="0" y="0" width="12" height="400" fill="#149ddd"/><text x="50" y="100" font-size="38" font-weight="700" fill="#173b6c">Prompt Engineering</text><text x="50" y="145" font-size="20" fill="#555">Measuring what each part of a prompt is worth (gemma3:1b, 100 reviews)</text><rect x="50" y="210" width="210" height="140" rx="12" fill="#fff" stroke="#149ddd" stroke-width="2"/><text x="155" y="278" text-anchor="middle" font-size="34" font-weight="700" fill="#149ddd">0%</text><text x="155" y="314" text-anchor="middle" font-size="15" fill="#444">naive prompt (unparseable)</text><rect x="280" y="210" width="210" height="140" rx="12" fill="#fff" stroke="#149ddd" stroke-width="2"/><text x="385" y="278" text-anchor="middle" font-size="34" font-weight="700" fill="#149ddd">84%</text><text x="385" y="314" text-anchor="middle" font-size="15" fill="#444">structured prompt</text><rect x="510" y="210" width="210" height="140" rx="12" fill="#fff" stroke="#149ddd" stroke-width="2"/><text x="615" y="278" text-anchor="middle" font-size="34" font-weight="700" fill="#149ddd">86%</text><text x="615" y="314" text-anchor="middle" font-size="15" fill="#444">structured + few-shot</text><rect x="740" y="210" width="210" height="140" rx="12" fill="#fff" stroke="#149ddd" stroke-width="2"/><text x="845" y="278" text-anchor="middle" font-size="34" font-weight="700" fill="#149ddd">58%</text><text x="845" y="314" text-anchor="middle" font-size="15" fill="#444">always-negative baseline</text></svg>